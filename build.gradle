plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	runs {
		// ./gradlew runPreview: dev client that opens the click GUI and saves run/screenshots/monolith-preview.png
		preview {
			inherit client
			name "Monolith Preview"
			property "monolith.preview", "true"
			programArgs "--width", "1600", "--height", "900"
		}
		// ./gradlew runPreviewWorld: same check inside run/saves/New World
		previewWorld {
			inherit client
			name "Monolith Preview World"
			property "monolith.previewWorld", "true"
			programArgs "--width", "1600", "--height", "900", "--quickPlaySingleplayer", "New World"
		}
	}

	mods {
		"monolith" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion
	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
